<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="version" content="5">
  <meta name="theme-color" content="#000000">
  <title>Nébula 💗</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mundo.css">
  <script src="painel.js"></script>
</head>
<body data-m="neutral">

  <div id="screen">
    <div id="face">

            <mask id="mkr" style="--s:-1">

              <circle r="28"/><circle r="66"/><circle r="104"/>
            </g>
          </defs>

          <g class="sq">
            <!-- bochechas -->
            <ellipse class="bs" cx="318" cy="517" rx="60" ry="25"/>

<use class="ef dg dl" href="#dm" mask="url(#mkl)"/>

                  <use class="sg" href="#sp"/>
                </g></g>
                <g transform="translate(1217 375)"><g class="sc">
                 <circle class="ef cc cc-r" r="122" cy="-8"/>
<use class="ef dg dr" href="#dm" mask="url(#mkr)"/>
                  <use class="hg" href="#ht"/>
                  <use class="sg" href="#sp"/>
                </g></g>
                <use class="ef ag ag-l" href="#ar"/>
<g transform="translate(1672 0) scale(-1 1)"><use class="ef ag ag-r" href="#ar"/></g>
              </g>

              <!-- bocas -->
              <path class="mo mo-n" d="M732 527C732 575 770 600 802 590C826 582 836 560 840 548C844 560 854 582 878 590C910 600 948 575 948 527"/>
              <path class="mo fl mo-o" d="M694 490C760 480 910 480 976 490C992 600 940 738 835 738C730 738 678 600 694 490Z"/>

<path class="mo mo-c" d="M738 484Q778 576 742 668M934 484Q894 576 930 668M812 512C864 500 880 556 834 576C886 588 880 664 806 652"/>

            <g transform="translate(430 470)"><path class="tr" d="M0 0C-14 24-14 40 0 44C14 40 14 24 0 0Z"/></g>
            <g transform="translate(1190 470)"><path class="tr" d="M0 0C-14 24-14 40 0 44C14 40 14 24 0 0Z"/></g>

        <b id="sym">💢</b>
        <b id="acc"></b>

    </div>

  <div id="bubble"></div>
  <div id="panel"></div>
  <div id="estado"></div>

  <div id="bar">
    <button id="bXarope" style="display:none">🍯 Xarope</button>
    <button id="bEstado">💗 Estado</button>
    <button id="bCuidar">🧸 Cuidar</button>
    <button id="bBrincar">🎮 Brincar</button>
    <button id="bMundo">✨ Mundo</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="game.js"></script>
  <script src="nebo_dna.js"></script>
  <script src="boutique-visual.js"></script>

</html>
