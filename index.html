<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <div id="bubble"></div>
 <div id="panel"></div>

    <button id="bCuidar">🧸 Cuidar</button>
    <button id="bBrincar">🎮 Brincar</button>
    <button id="bCasa">🏠 Casa</button>
    <button id="bMundo">✨ Mundo</button>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
